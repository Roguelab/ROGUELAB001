<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROGUELAB Package</title>
<style>body{margin:0;background:#080808;color:#fff;font-family:Arial}.wrap{max-width:650px;margin:auto;padding:24px 16px}.brand{font-size:26px;font-weight:900;letter-spacing:4px}.card{margin-top:24px;background:#111;border:1px solid #292929;border-radius:20px;padding:22px}.badge{display:inline-block;border:1px solid #555;border-radius:99px;padding:7px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.item{background:#181818;border-radius:13px;padding:14px}.label{font-size:11px;color:#999;text-transform:uppercase}.value{margin-top:6px;font-weight:bold;word-break:break-word}.qr{text-align:center;margin-top:22px}.qr img{width:220px;background:#fff;padding:8px;border-radius:10px}.muted{color:#999;font-size:13px}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="brand">ROGUELAB</div><div id="app" class="card">Loading...</div></main>
<script>
const id=location.pathname.split("/").pop().toUpperCase(),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
fetch("/api/package/"+encodeURIComponent(id)).then(r=>{if(!r.ok)throw 0;return r.json()}).then(p=>{let f=(a,b)=>b?`<div class="item"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`:"";document.getElementById("app").innerHTML=`<div class="muted">PACKAGE ID</div><h1>${esc(p.id)}</h1><div class="badge">${esc(p.status)}</div><div class="grid">${f("Product",p.product)}${f("Quantity",p.quantity)}${f("Weight",p.weight)}${f("Declared Value",p.declaredValue)}${f("Origin",p.origin)}${f("Destination",p.destination)}${f("Tracking",p.tracking)}${f("Estimated Delivery",p.estimatedDelivery)}</div><div class="qr"><img src="/api/package/${encodeURIComponent(p.id)}/qr"><div class="muted">Last updated: ${esc(p.updatedAt)}</div></div>`}).catch(()=>document.getElementById("app").innerHTML="<h2>Package not found</h2>");
</script></body></html>
