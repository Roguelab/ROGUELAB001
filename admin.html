<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROGUELAB QR Manager</title>
<style>body{margin:0;background:#080808;color:#fff;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:20px 14px}.brand{font-size:25px;font-weight:900;letter-spacing:4px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:12px;box-sizing:border-box;background:#181818;color:#fff;border:1px solid #333;border-radius:10px;margin-top:6px}label{font-size:12px;color:#aaa;display:block;margin-top:10px}button{padding:11px 15px;border:0;border-radius:10px;margin:8px 6px 0 0;font-weight:bold}.item{border:1px solid #292929;border-radius:14px;padding:14px;margin-top:10px}.muted{color:#999;font-size:13px}.hidden{display:none}.danger{background:#5c1616;color:#fff}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="brand">ROGUELAB</div><div class="muted">QR PACKAGE MANAGER</div>
<div id="login" class="card"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="panel" class="hidden"><div class="card"><h2 id="title">Create Package</h2><div class="row">
<div><label>Package ID</label><input id="id" placeholder="PKG001"></div><div><label>Status</label><select id="status"><option>Preparing</option><option>Shipped</option><option>In Transit</option><option>Delivered</option><option>On Hold</option></select></div>
<div><label>Product</label><input id="product"></div><div><label>Quantity</label><input id="quantity" type="number" value="1"></div>
<div><label>Weight</label><input id="weight"></div><div><label>Declared Value</label><input id="value"></div>
<div><label>Origin</label><input id="origin" value="Sri Lanka"></div><div><label>Destination</label><input id="destination"></div>
<div><label>Tracking</label><input id="tracking"></div><div><label>Estimated Delivery</label><input id="delivery"></div></div>
<button onclick="save()">Save</button><button onclick="reset()">New</button><p id="saveMsg"></p></div>
<div class="card"><h2>Packages</h2><div id="list">Loading...</div></div></div></main>
<script>
let token="",editing=null;const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(u,o={}){o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{},token?{Authorization:"Bearer "+token}:{});return fetch(u,o)}
async function login(){let r=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:v("pw")})});if(!r.ok)return $("msg").textContent="Wrong password";token=(await r.json()).token;$("login").classList.add("hidden");$("panel").classList.remove("hidden");load()}
async function load(){let a=await(await api("/api/admin/packages")).json();$("list").innerHTML=a.map(p=>`<div class="item"><b>${esc(p.id)}</b> — ${esc(p.product)}<br><span class="muted">${esc(p.status)} · ${esc(p.destination)}</span><br><button onclick='edit(${JSON.stringify(p)})'>Edit</button><button onclick='openPage("${p.id}")'>Open</button><button onclick='qr("${p.id}")'>QR</button><button class="danger" onclick='del("${p.id}")'>Delete</button></div>`).join("")||"No packages."}
function edit(p){editing=p.id;$("title").textContent="Edit "+p.id;for(let [id,val] of [["id",p.id],["status",p.status],["product",p.product],["quantity",p.quantity],["weight",p.weight],["value",p.declaredValue],["origin",p.origin],["destination",p.destination],["tracking",p.tracking],["delivery",p.estimatedDelivery]])$(id).value=val||"";scrollTo(0,0)}
async function save(){let p={id:v("id"),status:v("status"),product:v("product"),quantity:+v("quantity")||1,weight:v("weight"),declaredValue:v("value"),origin:v("origin"),destination:v("destination"),tracking:v("tracking"),estimatedDelivery:v("delivery")};let u=editing?"/api/admin/packages/"+encodeURIComponent(editing):"/api/admin/packages";let r=await api(u,{method:editing?"PUT":"POST",body:JSON.stringify(p)}),d=await r.json();$("saveMsg").textContent=r.ok?"Saved: "+location.origin+"/p/"+d.id:(d.error||"Error");if(r.ok){editing=d.id;load()}}
function openPage(id){open("/p/"+id,"_blank")}function qr(id){open("/api/package/"+id+"/qr","_blank")}
async function del(id){if(confirm("Delete "+id+"?")){await api("/api/admin/packages/"+id,{method:"DELETE"});load()}}
function reset(){editing=null;$("title").textContent="Create Package";["id","product","weight","value","destination","tracking","delivery"].forEach(x=>$(x).value="");$("quantity").value=1;$("origin").value="Sri Lanka";$("status").value="Preparing"}
</script></body></html>
